<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <title>University Cost Estimator</title>

  <!-- UofG Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous" />
  <link
    href="https://fonts.googleapis.com/css2?family=Bitter:wght@400;600;700;800&family=DM+Sans:wght@400;500;600;700;800;900&display=swap"
    rel="stylesheet"
  />

  <!-- UofG Web Components CSS -->
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/@uoguelph/web-components@2/dist/uofg-web-components/uofg-web-components.css"
  />

  <!-- UofG Web Components JS -->
  <script
    type="module"
    src="https://cdn.jsdelivr.net/npm/@uoguelph/web-components@2/dist/uofg-web-components/uofg-web-components.esm.js"
  ></script>

  <style>
    :root {
      --page-bg: var(--uog-color-grey-light-bg, #f5f5f5);
      --surface: var(--uog-color-white, #fff);
      --text: var(--uog-color-body-copy, #555);
      --text-strong: var(--uog-color-body-copy-bold, #333);
      --border: var(--uog-color-grey-light-focus, #bfbfbf);
      --border-soft: #dedede;

      --red: var(--uog-color-red, #e51937);
      --red-focus: var(--uog-color-red-focus, #b3142c);
      --blue: var(--uog-color-blue, #187bb4);
      --blue-focus: var(--uog-color-blue-focus, #135f8b);
      --green: var(--uog-color-green, #318738);
      --yellow: var(--uog-color-yellow, #ffc429);
      --yellow-focus: var(--uog-color-yellow-focus, #ffe299);

      --radius-sm: 0.6rem;
      --radius-md: 0.8rem;
      --radius-lg: 1.2rem;

      --space-xs: 0.8rem;
      --space-sm: 1.2rem;
      --space-md: 1.6rem;
      --space-lg: 2.4rem;
      --space-xl: 3.2rem;
    }

    html {
      font-size: 62.5%;
      scroll-behavior: smooth;
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "DM Sans", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 1.6rem;
      line-height: 1.5;
      color: var(--text);
      background: var(--surface);
    }

    h1,
    h2,
    h3,
    h4 {
      font-family: "Bitter", Georgia, serif;
      color: var(--text-strong);
      line-height: 1.15;
    }

    a {
      color: var(--uog-color-body-copy-link, #187bb4);
    }

    uofg-header,
    uofg-footer {
      display: block;
    }

    .skip-link {
      position: absolute;
      top: -5rem;
      left: 1.6rem;
      z-index: 10000;
      padding: 1rem 1.4rem;
      border-radius: var(--radius-sm);
      color: #fff;
      background: #000;
      font-weight: 800;
      text-decoration: none;
    }

    .skip-link:focus {
      top: 1.6rem;
      outline: 0.3rem solid var(--yellow-focus);
      outline-offset: 0.2rem;
    }

    .container {
      width: min(100% - 3.2rem, 96rem);
      margin-inline: auto;
    }

    .page {
      padding: 3.6rem 0 5.6rem;
    }

    .page-header {
      margin-bottom: 2.4rem;
    }

    .page-title {
      margin: 0 0 0.8rem;
      font-size: clamp(3.2rem, 4vw, 4.6rem);
      font-weight: 800;
      letter-spacing: -0.02em;
    }

    .page-intro {
      max-width: 72rem;
      margin: 0;
      font-size: 1.75rem;
      color: var(--text);
    }

    .estimator-shell {
      display: block;
    }

    .estimator-main {
      width: 100%;
      min-width: 0;
    }

    .estimator-panel {
      border: 0.1rem solid var(--border-soft);
      border-radius: var(--radius-lg);
      background: var(--surface);
      overflow: hidden;
    }

    .estimator-progress {
      padding: 2.4rem;
      border-bottom: 0.1rem solid var(--border-soft);
      background: var(--page-bg);
    }

    .progress-topline {
      display: flex;
      justify-content: space-between;
      gap: 1.6rem;
      align-items: flex-start;
      margin-bottom: 1.6rem;
    }

    .status-eyebrow,
    .section-kicker {
      margin: 0 0 0.4rem;
      font-size: 1.2rem;
      font-weight: 900;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .status-eyebrow,
    .section-kicker {
      color: var(--red);
    }

    .status-title {
      margin: 0;
      font-family: "Bitter", Georgia, serif;
      font-size: 2.3rem;
      font-weight: 800;
      color: var(--text-strong);
    }

    .status-subtitle {
      margin: 0.6rem 0 0;
      font-size: 1.4rem;
      color: var(--text);
    }

    .status-total {
      min-width: 18rem;
      text-align: right;
    }

    .status-total-label {
      display: block;
      margin-bottom: 0.4rem;
      font-size: 1.2rem;
      color: var(--text);
    }

    .status-total strong {
      font-size: 2.2rem;
      font-weight: 900;
      color: var(--green);
    }

    .progress-inline {
      display: flex;
      align-items: center;
      gap: 1.2rem;
      margin-bottom: 1.6rem;
    }

    .progress-inline-bar {
      flex: 1;
      height: 1rem;
      overflow: hidden;
      border-radius: 999rem;
      background: #dcdcdc;
    }

    .progress-inline-fill {
      height: 100%;
      border-radius: inherit;
      background: var(--blue);
      transition: width 0.25s ease;
    }

    .progress-inline-text {
      font-size: 1.3rem;
      font-weight: 900;
      white-space: nowrap;
      color: var(--text-strong);
    }

    .stepper {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 0.8rem;
      padding: 0;
      margin: 0;
    }

    .stepper-item {
      display: flex;
      align-items: center;
      gap: 0.8rem;
      min-height: 5.2rem;
      padding: 1rem;
      border: 0.1rem solid var(--border-soft);
      border-radius: var(--radius-sm);
      background: var(--surface);
      cursor: pointer;
      color: inherit;
      text-align: left;
    }

    .stepper-item:hover,
    .stepper-item.active {
      border-color: var(--blue);
      background: #eef6fa;
    }

    .stepper-item.done {
      border-color: var(--green);
      background: #eef7ef;
    }

    .stepper-num {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex: 0 0 2.8rem;
      width: 2.8rem;
      height: 2.8rem;
      border-radius: 999rem;
      background: var(--blue);
      color: #fff;
      font-size: 1.3rem;
      font-weight: 900;
    }

    .stepper-item.done .stepper-num {
      background: var(--green);
    }

    .stepper-label {
      font-size: 1.25rem;
      font-weight: 900;
      line-height: 1.2;
      color: var(--text-strong);
    }

    #flowContainer {
      width: 100%;
      min-height: 34rem;
    }

    .step-container {
      padding: clamp(2.4rem, 4vw, 4rem);
      background: var(--surface);
    }

    .step-header {
      margin-bottom: 2.4rem;
      padding-bottom: 1.6rem;
      border-bottom: 0.1rem solid var(--border-soft);
    }

    .step-title {
      margin: 0 0 0.8rem;
      font-size: 2.8rem;
      font-weight: 800;
    }

    .step-description {
      margin: 0;
      max-width: 72rem;
      font-size: 1.55rem;
      color: var(--text);
    }

    .step-content {
      min-height: 16rem;
      margin-bottom: 2.4rem;
    }

    .form-stack {
      display: flex;
      flex-direction: column;
      gap: 1.6rem;
      max-width: 72rem;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 0.8rem;
    }

    label,
    .form-group label {
      display: block;
      font-size: 1.35rem;
      font-weight: 900;
      color: var(--text-strong);
    }

    select,
    input[type="text"],
    input[type="email"],
    input[type="number"],
    .step-dropdown,
    .step-input,
    .readonly-field {
      width: 100%;
      min-height: 4.8rem;
      padding: 1.1rem 1.4rem;
      border: 0.2rem solid var(--border);
      border-radius: var(--radius-sm);
      outline: none;
      background: var(--surface);
      color: var(--text-strong);
      font: inherit;
      font-size: 1.5rem;
    }

    .readonly-field {
      display: flex;
      align-items: center;
      background: var(--page-bg);
    }

    select:focus,
    input:focus,
    button:focus,
    .stepper-item:focus {
      outline: 0.3rem solid var(--yellow-focus);
      outline-offset: 0.2rem;
      box-shadow: none;
    }

    button {
      min-height: 4.6rem;
      padding: 1rem 1.6rem;
      border-radius: var(--radius-sm);
      cursor: pointer;
      font: inherit;
      font-weight: 900;
    }

    .btn-primary {
      min-width: 16rem;
      border: 0;
      background: var(--red);
      color: #fff;
    }

    .btn-primary:hover {
      background: var(--red-focus);
    }

    .btn-secondary {
      min-width: 12rem;
      border: 0.2rem solid var(--border);
      background: var(--surface);
      color: var(--text-strong);
    }

    .btn-gold {
      min-width: 16rem;
      border: 0.1rem solid #d0a21d;
      background: var(--yellow);
      color: #000;
    }

    .step-footer,
    .step-actions,
    .welcome-actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1.2rem;
      margin-top: 2.4rem;
    }

    .welcome-actions {
      justify-content: flex-start;
    }

    .choice-row {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 1.6rem;
      margin-top: 2rem;
      max-width: 72rem;
    }

    .choice-card {
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
      width: 100%;
      min-height: 12rem;
      padding: 1.8rem;
      border: 0.2rem solid var(--border-soft);
      border-radius: var(--radius-md);
      background: var(--surface);
      text-align: left;
      color: inherit;
    }

    .choice-card:hover,
    .choice-card.selected {
      border-color: var(--blue);
      background: #eef6fa;
    }

    .choice-card-title {
      font-family: "Bitter", Georgia, serif;
      font-size: 1.9rem;
      font-weight: 800;
      color: var(--text-strong);
    }

    .choice-card-text {
      font-size: 1.4rem;
      color: var(--text);
    }

    .checkbox-item,
    .scholarship-option,
    .uog-alert {
      border: 0.1rem solid var(--border-soft);
      border-radius: var(--radius-sm);
      background: var(--surface);
    }

    .checkbox-item {
      display: flex;
      align-items: flex-start;
      gap: 1.2rem;
      padding: 1.2rem;
      cursor: pointer;
    }

    .checkbox-item input[type="checkbox"] {
      width: 2rem;
      height: 2rem;
      margin-top: 0.2rem;
      accent-color: var(--red);
    }

    .cost-summary,
    .estimate-total-card {
      margin-bottom: 1.8rem;
      padding: 2rem;
      border: 0.1rem solid var(--border-soft);
      border-radius: var(--radius-md);
      background: var(--page-bg);
    }

    .estimate-total-card {
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
    }

    .estimate-total-label {
      font-size: 1.3rem;
      font-weight: 900;
      color: var(--text-strong);
    }

    .estimate-total-card strong {
      font-size: 2.8rem;
      color: var(--green);
    }

    .summary-item {
      display: flex;
      justify-content: space-between;
      gap: 1.6rem;
      padding: 1.2rem 0;
      border-bottom: 0.1rem solid var(--border-soft);
    }

    .summary-item:last-child {
      border-bottom: 0;
    }

    .summary-value {
      font-size: 1.6rem;
      font-weight: 900;
      text-align: right;
      color: var(--green);
    }

    .uog-alert {
      margin: 1.4rem 0;
      overflow: hidden;
      max-width: 72rem;
    }

    .uog-alert-title {
      display: flex;
      align-items: center;
      gap: 0.8rem;
      padding: 1.2rem 1.4rem;
      font-size: 1.5rem;
      font-weight: 900;
    }

    .uog-alert-message {
      padding: 1.2rem 1.4rem 1.4rem;
      font-size: 1.4rem;
      line-height: 1.5;
      color: var(--text-strong);
    }

    .uog-alert-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 1.8rem;
      height: 1.8rem;
      border: 0.2rem solid currentColor;
      border-radius: 999rem;
      font-size: 1.2rem;
      font-weight: 900;
    }

    .uog-alert-yellow .uog-alert-title {
      background: var(--yellow);
      color: #000;
    }

    .uog-alert-blue .uog-alert-title {
      background: var(--blue);
      color: #fff;
    }

    .uog-alert-green .uog-alert-title {
      background: var(--green);
      color: #fff;
    }

    .uog-alert-red .uog-alert-title {
      background: var(--red);
      color: #fff;
    }

    .uog-alert-grey .uog-alert-title {
      background: #d9d9d9;
      color: #111;
    }

    .scholarship-checkbox-list {
      display: flex;
      flex-direction: column;
      gap: 0.8rem;
    }

    .scholarship-option {
      display: grid;
      grid-template-columns: 2rem 1fr;
      gap: 1rem;
      align-items: flex-start;
      padding: 1.2rem;
    }

    .scholarship-option input {
      width: 1.8rem;
      height: 1.8rem;
      accent-color: var(--red);
    }

    .scholarship-option-body,
    .scholarship-option-top,
    .scholarship-option-meta,
    .scholarship-option-note {
      display: block;
    }

    .scholarship-option-top {
      display: flex;
      justify-content: space-between;
      gap: 1.2rem;
      color: var(--text-strong);
    }

    .scholarship-option-meta,
    .scholarship-option-note,
    .form-help-text {
      margin: 0;
      font-size: 1.3rem;
      color: var(--text);
    }

    .contact-section {
      margin-top: 2rem;
    }

    .input-error,
    [aria-invalid="true"] {
      border-color: var(--red) !important;
      background: #fff5f6 !important;
    }

    .error-text {
      margin-top: 0.4rem;
      font-size: 1.2rem;
      color: var(--red);
    }

    .loading-spinner {
      width: 4rem;
      height: 4rem;
      margin: 3rem auto;
      border: 0.4rem solid var(--border-soft);
      border-top-color: var(--blue);
      border-radius: 999rem;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .uofg-back-to-top {
      position: fixed;
      right: 2.4rem;
      bottom: 2.4rem;
      z-index: 20;
      display: none;
      align-items: center;
      justify-content: center;
      width: 4.8rem;
      height: 4.8rem;
      padding: 0.8rem;
      border: 0;
      border-radius: 999rem;
      background: #000;
      color: #fff;
    }

    .uofg-back-to-top:hover {
      background: var(--red);
    }

    .uofg-back-to-top.show {
      display: inline-flex;
    }

    .uofg-back-to-top svg {
      width: 1.8rem;
      height: 1.8rem;
    }

    .sr-only {
      position: absolute;
      width: 0.1rem;
      height: 0.1rem;
      padding: 0;
      margin: -0.1rem;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }
    .campus-gallery-wrapper {
      margin-top: 2rem;
    }

    .campus-gallery-title,
    .subsection-title {
      margin: 0 0 1.4rem;
      font-size: 1.6rem;
      font-weight: 900;
      color: var(--text-strong);
    }

    .campus-gallery {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1.4rem;
    }

    .campus-gallery-card {
      height: 17rem;
      border-radius: 1.2rem;
      overflow: hidden;
      border: 0.1rem solid var(--border-soft);
      background: #f4f4f4;
    }

    .campus-gallery-card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .success-story-grid {
      display: flex;
      flex-direction: column;
      gap: 1.2rem;
    }

    .success-story-card {
      display: grid;
      grid-template-columns: 8rem 1fr;
      gap: 1.6rem;
      padding: 1.4rem;
      border: 0.1rem solid var(--border-soft);
      border-radius: 0.8rem;
      background: var(--surface);
    }

    .success-story-card img {
      width: 6.6rem;
      height: 6.6rem;
      object-fit: cover;
      border-radius: 0.8rem;
    }

    .success-story-card h3 {
      margin: 0 0 0.6rem;
      font-size: 1.7rem;
    }

    .success-story-meta {
      margin: 0 0 1.4rem;
      font-size: 1.25rem;
      font-weight: 700;
    }

    .success-story-text {
      font-size: 1.25rem;
      line-height: 1.5;
      white-space: pre-line;
    }

    .success-story-total {
      margin-top: 1.2rem;
      font-size: 1.45rem;
      font-weight: 900;
      color: var(--red);
    }
    .quick-links-section {
    margin-top: 2.4rem;
    max-width: 72rem;
  }

  .quick-links-heading {
    margin-bottom: 1.2rem;
    font-size: 1.4rem;
    font-weight: 900;
    color: var(--text-strong);
  }

  .quick-link-row {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 1.4rem;
  }

  .quick-link-card {
    display: block;
    padding: 1.6rem;
    border: 0.1rem solid var(--border-soft);
    border-radius: var(--radius-md);
    background: var(--surface);
    text-decoration: none;
    color: inherit;
    transition: 0.2s;
  }

  .quick-link-card:hover {
    border-color: var(--blue);
    background: #eef6fa;
  }

  .quick-link-title {
    display: block;
    margin-bottom: 0.6rem;
    font-family: "Bitter", Georgia, serif;
    font-size: 1.8rem;
    font-weight: 800;
  }

  .quick-link-text {
    display: block;
    margin-bottom: 1rem;
    font-size: 1.35rem;
  }

  .quick-link-action {
    color: var(--blue);
    font-weight: 900;
  }
  @media (max-width: 768px) {
    .stepper {
      display: none;
    }
    
    .estimate-total-card {
      display: none;
    }
    .estimator-progress {
      padding-bottom: 1.6rem;
    }
  }
  @media (max-width: 768px) {
    .quick-link-row {
      grid-template-columns: 1fr;
    }
  }
    @media (max-width: 760px) {
      .campus-gallery {
        grid-template-columns: 1fr;
      }

      .success-story-card {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 640px) {
      .success-story-card {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 760px) {
      html {
        font-size: 58%;
      }

      .container {
        width: min(100% - 2.4rem, 96rem);
      }

      .progress-topline {
        flex-direction: column;
      }

      .status-total {
        text-align: left;
      }

      .progress-inline {
        align-items: flex-start;
        flex-direction: column;
      }

      .progress-inline-bar {
        width: 100%;
      }

      .stepper {
        grid-template-columns: 1fr;
      }

      .stepper-item {
        min-height: 4.8rem;
      }

      .choice-row {
        grid-template-columns: 1fr;
      }

      .step-footer,
      .step-actions,
      .welcome-actions {
        flex-direction: column;
        align-items: stretch;
      }

      .btn-primary,
      .btn-secondary,
      .btn-gold {
        width: 100%;
      }

      .summary-item,
      .scholarship-option-top {
        flex-direction: column;
        gap: 0.4rem;
      }

      .summary-value {
        text-align: left;
      }
    }
  </style>
</head>

<body>
  <a class="skip-link" href="#main-content">Skip to main content</a>

  <uofg-header></uofg-header>

  <main class="site-main" id="main-content">
    <div class="page">
      <div class="container">
        <header class="page-header">
          <h1 class="page-title">University Cost Estimator</h1>
          <p class="page-intro">
            Estimate tuition, fees, living costs, and optional expenses using a guided form.
          </p>
        </header>

        <section class="estimator-shell" aria-label="Cost estimator">
          <div class="estimator-main">
            <div class="estimator-panel">
              <div class="estimator-progress">
                <div class="progress-topline" id="topStatusCard">
                  <div>
                    <p class="status-eyebrow" id="statusEyebrow">Step 0 of 5</p>
                    <h2 class="status-title" id="statusTitle">Welcome</h2>
                    <p class="status-subtitle" id="statusSubtitle">Start your estimate.</p>
                  </div>

                  <div class="status-total">
                    <span class="status-total-label">Estimated total so far</span>
                    <strong id="topRunningTotal">CAD 0</strong>
                  </div>
                </div>

                <div class="progress-inline" id="progressInline" aria-label="Progress">
                  <div class="progress-inline-bar" aria-hidden="true">
